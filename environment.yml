# Tested inference environment for PhenoCompass v0.1.0 (CPU; Linux x86_64).
# Python from conda-forge; scientific stack as PyPI wheels (a full conda-forge
# solve with deepchem + PyTorch 2.x is very slow).
#
#   mamba env create -f environment.yml
#   conda activate phenocompass
#
# For GPU, install the matching CUDA build of torch first, e.g.
#   pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128
name: phenocompass
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.9.1
      - pytorch-lightning==2.6.1
      - torch-geometric==2.7.0
      - rdkit==2024.9.6  # must stay < 2025.3 (NumHAcceptors change)
      - descriptastorus==2.8.0
      - deepchem==2.8.0
      - numpy==2.2.6
      - pandas==2.3.3
      - pyarrow==22.0.0
      - scipy==1.17.0
      - scikit-learn==1.8.0
      - statsmodels==0.14.6
      - numba==0.61.2
      - networkx==3.6.1
      - h5py==3.15.1
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - tqdm==4.67.1
      - -e .
